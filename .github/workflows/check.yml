name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop Build & Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Compile Kotlin Desktop
        run: .\gradlew.bat :desktopApp:compileKotlin

      - name: Run desktop tests
        run: .\gradlew.bat :desktopApp:test

      # The shared layer is what every desktop module compiles against;
      # its own suite runs here so a purge cannot go unnoticed.
      - name: Run shared tests
        run: .\gradlew.bat :shared:jvmTest

  desktop-linux:
    name: Desktop Build (Linux target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      # The same sources, asked for Linux artefacts: this is what keeps the MPRIS, tray and
      # audio-watcher code from drifting out of build.
      - name: Compile Kotlin Desktop for Linux
        run: ./gradlew :desktopApp:compileKotlin
